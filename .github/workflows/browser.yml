name: Clarity browser checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: clarity-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, 'host:r720-ai']
    timeout-minutes: 20
    container:
      image: python:3.12-bookworm
      options: --cpus 2 --shm-size=512m
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install hash-pinned runtime and browser-test dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r requirements.lock -r requirements-browser.lock
      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps --only-shell chromium
      - name: Exercise real browser forms and cross-origin referrer privacy
        run: python -m unittest discover -s tests/browser -v

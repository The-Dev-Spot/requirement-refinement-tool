name: Clarity browser checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: clarity-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install hash-pinned runtime and browser-test dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r requirements.lock -r requirements-browser.lock
      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps --only-shell chromium
      - name: Exercise real browser forms and cross-origin referrer privacy
        run: python -m unittest discover -s tests/browser -v

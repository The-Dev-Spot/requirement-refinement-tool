name: Clarity checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m clarity validate-config
      - run: python -m unittest discover -s tests -v
      - run: python -m clarity gate examples/complete-report.json
      - run: python -m clarity check-repo

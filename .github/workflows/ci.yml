name: Clarity toolkit checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  toolkit:
    runs-on: ubuntu-latest
    container: node:24-bookworm-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install maintainer validation dependencies
        run: npm ci --ignore-scripts --prefix .github/validation
      - name: Validate toolkit and fictional examples
        run: node .github/validation/check-toolkit.mjs
      - name: Test deterministic L1-L10 preflight and missing-evidence safety
        run: node --test .github/validation/quality-gate.test.mjs

  handoff-export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test deterministic handoff exporter (no model or secrets)
        run: python -m unittest discover -s tests -p 'test_forge_handoff_export.py' -v
      - name: Compile exporter and validate sample format
        run: python -m py_compile scripts/export_forge_handoff.py

  quality-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned local Gherkin parser only
        run: npm ci --ignore-scripts --prefix .github/validation
      - name: Run independent-session runner contract tests (synthetic, no model)
        run: python -m unittest discover -s tests -p 'test_quality_review.py' -v
      - name: Test scoped decision contracts (synthetic, no model)
        run: python -m unittest discover -s tests -p 'test_decision_scopes.py' -v
      - name: Test private Clarity question export and safe notification outbox
        run: python -m unittest discover -s tests -p 'test_review_question_export.py' -v
      - name: Test offline pinned Linear and GitHub evidence (synthetic, no network)
        run: python -m unittest discover -s tests -p 'test_evidence_context.py' -v
      - name: Test read-only Linear and GitHub collector (mocked APIs, no credentials)
        run: python -m unittest discover -s tests -p 'test_collect_context.py' -v
      - name: Test scoped Linear history-only context reader (mocked, no token)
        run: python -m unittest discover -s tests -p 'test_linear_history_context.py' -v
      - name: Test GitHub-only issue and repository evidence (mocked, no tokens)
        run: python -m unittest discover -s tests -p 'test_github_context.py' -v
      - name: Test offline GitHub evidence to question triage preview (no model)
        run: python -m unittest discover -s tests -p 'test_github_question_triage.py' -v
      - name: Test provenance-bound question relevance gate (synthetic, no model)
        run: python -m unittest discover -s tests -p 'test_question_relevance_gate.py' -v
      - name: Test no-tool, model-backed question research proposer (fully mocked)
        run: python -m unittest discover -s tests -p 'test_question_relevance_research.py' -v
      - name: Test separate independent challenge of source sufficiency (fully mocked)
        run: python -m unittest discover -s tests -p 'test_question_relevance_verify.py' -v
      - name: Check read-only GitHub source freshness and issue revision (fully mocked)
        run: python -m unittest discover -s tests -p 'test_recheck_github_sources.py' -v
      - name: Verify issue #37 GitHub-only pilot inputs and draft boundaries
        run: python -m unittest discover -s tests -p 'test_github_media_issue37.py' -v
      - name: Test draft acceptance contract safeguards (no authority)
        run: python -m unittest discover -s tests -p 'test_acceptance_contract_draft.py' -v
      - name: Validate read-only acceptance proposal and tamper regressions
        run: python -m unittest discover -s tests -p 'test_acceptance_proposal.py' -v
      - name: Compare review outcomes across synthetic model variants and golden cases
        run: python -m unittest discover -s tests -p 'test_benchmark_review_consistency.py' -v
      - name: Verify runtime code compiles
        run: python -m py_compile scripts/quality_review.py scripts/evidence_context.py scripts/collect_context.py scripts/collect_github_context.py scripts/collect_linear_history.py scripts/preview_github_review.py scripts/question_relevance_gate.py scripts/question_relevance_research.py scripts/question_relevance_verify.py scripts/recheck_github_sources.py scripts/decision_scopes.py scripts/export_review_questions.py scripts/accept_requirements.py scripts/benchmark_review_consistency.py
